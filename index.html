<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafaf7">
<title>BuglonWiki — Buku & Ensiklopedia Gratis · bawapi-katak</title>
<link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fafaf7">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/qrcode.js"></script>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <svg width="38" height="38" viewBox="0 0 200 200" aria-hidden="true"><path d="M40 30h120v150H40z" fill="#fff" stroke="#58a85c" stroke-width="10"/><path d="M65 70h70M65 98h70M65 126h48" stroke="#58a85c" stroke-width="7" stroke-linecap="round"/></svg>
      <div class="wm">Buglon<span>WIKI</span></div>
    </div>
    <p class="tagline">Buku<br>&amp; ensiklopedia<br>gratis</p>
    <nav>
      <button class="navlink active" data-view="artikel">Artikel</button>
      <button class="navlink" data-view="buku">Buku Gratis</button>
      <button class="navlink" data-view="jurnal">Jurnal</button>
      <button class="navlink" data-view="tentang">Tentang</button>
    </nav>
    <div class="side-sec">
      <h4>Bagikan</h4>
      <p class="muted">Scan QR pakai kamera HP untuk buka appnya.</p>
      <button class="btn-primary" id="openQr">Tampilkan QR</button>
    </div>
    <div class="side-foot">v2.0 · bawapi-katak</div>
  </aside>

  <div id="main">
    <header id="topbar">
      <h1 class="brandline">Buglon<span>WIKI</span></h1>
      <div class="search-wrap">
        <input id="q" placeholder="Cari artikel, buku, jurnal…" autocomplete="off" aria-label="Cari">
        <button id="searchBtn">Cari</button>
      </div>
      <div id="suggest" class="hidden"></div>
    </header>

    <main id="result" aria-live="polite"></main>
  </div>
</div>

<!-- QR MODAL -->
<div id="qrModal" class="hidden" role="dialog" aria-modal="true">
  <div class="modal-inner">
    <button class="modal-close" id="closeQr" aria-label="Tutup">✕</button>
    <h3>Bagikan BuglonWiki</h3>
    <canvas id="qrCanvas" width="200" height="200"></canvas>
    <p class="muted">Arahkan kamera HP ke QR ini.</p>
    <button class="btn-primary" id="downloadQr">Download QR</button>
  </div>
</div>

<script src="assets/js/app.js"></script>
</body>
</html>
